name: Sync MetaCubeX media and cryptocurrency rules

on:
  schedule:
    - cron: '47 */8 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-metacubex-categories.yml'
      - 'scripts/convert_category_ai_non_cn.rb'

permissions:
  contents: write

concurrency:
  group: sync-metacubex-categories
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Download and convert rules
        shell: bash
        run: |
          temporary_dir="$(mktemp -d)"
          trap 'rm -rf "$temporary_dir"' EXIT
          rules=(category-media category-entertainment category-cryptocurrency)
          source_root='https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite'

          for name in "${rules[@]}"; do
            curl --fail --silent --show-error --location --retry 3 --retry-max-time 90 \
              --connect-timeout 10 --max-time 45 "$source_root/$name.yaml" -o "$temporary_dir/$name.yaml"
            ruby scripts/convert_category_ai_non_cn.rb "$temporary_dir/$name.yaml" "$name" > "$temporary_dir/$name.list"
          done

          mkdir -p rule
          for name in "${rules[@]}"; do
            mv "$temporary_dir/$name.list" "rule/$name.list"
          done

      - name: Publish updated rule list
        shell: bash
        run: |
          git add -- rule/category-media.list rule/category-entertainment.list rule/category-cryptocurrency.list
          if git diff --cached --quiet; then
            echo "Rule list is up to date."
            exit 0
          fi

          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Sync MetaCubeX media and cryptocurrency Loon rules'
          git push origin HEAD:refs/heads/main
